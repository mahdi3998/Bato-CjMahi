version: '3.8'
services:
  php:
    image: php:8.2-fpm
    container_name: bato_php
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - mysql
      - redis
  nginx:
    image: nginx:stable
    container_name: bato_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./deploy/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - php
  mysql:
    image: mysql:8.0
    container_name: bato_mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: bato
      MYSQL_USER: bato_user
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
  redis:
    image: redis:7
    container_name: bato_redis
    ports:
      - "6379:6379"

volumes:
  db_data:
